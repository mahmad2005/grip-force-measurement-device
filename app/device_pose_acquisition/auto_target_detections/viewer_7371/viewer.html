<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AprilTag 3D Viewer</title>
    <style>
        html, body { margin:0; padding:0; background:#111; color:#eee; font-family:Arial,sans-serif; overflow:hidden; }
        #bar { position:fixed; left:0; right:0; top:0; height:46px; display:flex; align-items:center; gap:8px; padding:6px 10px; background:#1a1a1a; border-bottom:1px solid #333; z-index:10; }
        #view { position:fixed; left:0; right:0; top:46px; bottom:0; width:100vw; height:calc(100vh - 46px); display:block; }
        button,input { font-size:14px; }
        #slider { flex:1; }
        #status { min-width:180px; text-align:right; font-size:13px; color:#ccc; }
        #rightStack { position:fixed; top:58px; right:14px; width:390px; display:flex; flex-direction:column; gap:14px; z-index:12; }
        .stackPanel { background:rgba(20,20,20,0.86); border:1px solid #444; border-radius:8px; padding:10px 12px; }
        #overlapPanel { max-height:calc(100vh - 520px); overflow:auto; }
        #overlapTitle { font-weight:700; margin-bottom:8px; color:#fff; }
        .overlapRow { display:flex; justify-content:space-between; gap:10px; font-size:13px; line-height:1.45; }
        .overlapLabel { color:#ddd; }
        .overlapValue { color:#8fd3ff; }
        .sidePanel { position:fixed; left:14px; width:466px; background:rgba(20,20,20,0.86); border:1px solid #444; border-radius:8px; padding:10px 12px; z-index:12; }
        #cylinderCanvas { width:100%; height:360px; border:1px solid #333; border-radius:6px; background:#0a0c0f; display:block; cursor:grab; }
        #cylinderCanvas.dragging { cursor:grabbing; }
        #pressurePanel { top:58px; }
        #imuPanel { top:384px; }
        .panelTitle { font-weight:700; margin-bottom:8px; color:#fff; }
        .miniText { font-size:12px; color:#cfd2d8; margin-top:6px; }
        .panelBtn { margin-top:6px; font-size:12px; padding:4px 6px; }
        #pressureCanvas { width:440px; height:220px; border:1px solid #333; border-radius:4px; background:#000; image-rendering:pixelated; }
        #imuChart { width:100%; height:210px; border:1px solid #333; border-radius:4px; background:#040b14; display:block; }
        #imuRows { margin-top:6px; }
        .imuRow { display:flex; justify-content:space-between; gap:8px; font-size:12px; line-height:1.45; }
        .imuLabel { color:#ddd; }
        .imuValue { color:#8fd3ff; text-align:right; }

        @media (max-width: 900px) {
            .sidePanel { width:398px; left:8px; padding:8px; }
            #pressureCanvas { width:380px; height:190px; }
            #imuChart { height:170px; }
            #imuPanel { top:331px; }
            #rightStack { right:8px; width:320px; }
            #cylinderCanvas { height:300px; }
        }
    </style>
</head>

                const t=i/segs*Math.PI*2;
                const off = add(mul(u, cylRadius*Math.cos(t)), mul(w, cylRadius*Math.sin(t)));
                rb.push(add(base3,off));
                rt.push(add(top,off));
                shadow.push([baseShadow[0] + off[0], 0, baseShadow[2] + off[2]]);
            }
            poly(shadow,'#666666',1,false);
            poly(rb,'#ff4dff',2,false);
            poly(rt,'#ff4dff',2,false);
            for(let i=0;i<segs;i+=5) line(rb[i],rt[i],'#ff4dff',1.5);
            line(base3, top, '#ffffff', 1);
        }
        function rotateCylinderPoint(p){
            const x = p[0], y = p[1], z = p[2];
            const cy = Math.cos(cylinderCam.yaw), sy = Math.sin(cylinderCam.yaw);
            const cp = Math.cos(cylinderCam.pitch), sp = Math.sin(cylinderCam.pitch);
            const x1 = x * cy + z * sy;
            const z1 = -x * sy + z * cy;
            const y2 = y * cp - z1 * sp;
            const z2 = y * sp + z1 * cp;
            return [x1, y2, z2];
        }
        function projectCylinderPoint(p){
            const q = rotateCylinderPoint(p);
            const d = cylinderCam.dist / cylinderCam.zoom;
            const zz = q[2] + d;
            if(zz <= 0.05){ return null; }
            const scale = Math.min(cylinderCanvas.width, cylinderCanvas.height) * 0.36;
            return {
                x: cylinderCanvas.width * 0.5 + (q[0] * scale / zz),
                y: cylinderCanvas.height * 0.54 - (q[1] * scale / zz),
                depth: q[2]
            };
        }
        function drawCylinderPolygon(points, fill, stroke){
            if(points.length < 3){ return; }
            cylinderCtx.beginPath();
            cylinderCtx.moveTo(points[0].x, points[0].y);
            for(let i = 1; i < points.length; i++){
                cylinderCtx.lineTo(points[i].x, points[i].y);
            }
            cylinderCtx.closePath();
            cylinderCtx.fillStyle = fill;
            cylinderCtx.fill();
            if(stroke){
                cylinderCtx.strokeStyle = stroke;
                cylinderCtx.lineWidth = 1;
                cylinderCtx.stroke();
            }
        }
        function faceNormalCameraSpace(vertices){
            if(!Array.isArray(vertices) || vertices.length < 3){ return null; }
            const a = rotateCylinderPoint(vertices[0]);
            const b = rotateCylinderPoint(vertices[1]);
            const c = rotateCylinderPoint(vertices[2]);
            return cross(
                [b[0] - a[0], b[1] - a[1], b[2] - a[2]],
                [c[0] - a[0], c[1] - a[1], c[2] - a[2]]
            );
        }
        function isFrontFacingCylinderFace(vertices){
            const normal = faceNormalCameraSpace(vertices);
            if(!normal){
                return false;
            }
            let cx = 0, cy = 0, cz = 0;
            for(let i = 0; i < vertices.length; i++){
                const p = rotateCylinderPoint(vertices[i]);
                cx += p[0];
                cy += p[1];
                cz += p[2];
            }
            cx /= vertices.length;
            cy /= vertices.length;
            cz /= vertices.length;
            const toCamera = [-cx, -cy, (-cylinderCam.dist / cylinderCam.zoom) - cz];
            return ((normal[0] * toCamera[0]) + (normal[1] * toCamera[1]) + (normal[2] * toCamera[2])) > 0;
        }
        function renderPressureCylinder(){
            resizeCylinderCanvas();
            const width = cylinderCanvas.width;
            const height = cylinderCanvas.height;
            cylinderCtx.clearRect(0, 0, width, height);

            const gradient = cylinderCtx.createLinearGradient(0, 0, 0, height);
            gradient.addColorStop(0, '#11161d');
            gradient.addColorStop(1, '#090b0e');
            cylinderCtx.fillStyle = gradient;
            cylinderCtx.fillRect(0, 0, width, height);

            cylinderCtx.strokeStyle = '#1d2630';
            cylinderCtx.lineWidth = 1;
            cylinderCtx.beginPath();
            cylinderCtx.moveTo(width * 0.15, height * 0.78);
            cylinderCtx.lineTo(width * 0.85, height * 0.78);
            cylinderCtx.stroke();

            const session = mapSessionFrame(frame);
            const pressure = session && Array.isArray(session.pressure) ? session.pressure : null;
            if(!cylinderMesh){
                rebuildCylinderMesh();
            }
            if(!cylinderMesh || !Array.isArray(pressure) || pressure.length < (cylinderMesh.rows * cylinderMesh.cols)){
                cylinderCtx.fillStyle = '#dbe3ea';
                cylinderCtx.font = '14px Arial';
                cylinderCtx.textAlign = 'center';
                cylinderCtx.fillText('No pressure frame loaded', width * 0.5, height * 0.5);
                cylinderCtx.textAlign = 'start';
                if(!sessionReady){
                    cylinderStatsEl.textContent = 'Loading session.ndjson...';
                }else if(sessionLoadError){
                    cylinderStatsEl.textContent = sessionLoadError;
                }else if(sessionEntries.length === 0){
                    cylinderStatsEl.textContent = 'No session frames loaded. Use "Load session.ndjson".';
                }else{
                    cylinderStatsEl.textContent = 'No pressure frame for this index.';
                }
                return;
            }

            const drawItems = [];
            for(let i = 0; i < cylinderMesh.caps.length; i++){
                const cap = cylinderMesh.caps[i];
                if(!isFrontFacingCylinderFace(cap.vertices)){
                    continue;
                }
                const projectedCap = [];
                let depthCap = 0;
                let visibleCap = true;
                for(let j = 0; j < cap.vertices.length; j++){
                    const pt = projectCylinderPoint(cap.vertices[j]);
                    if(!pt){ visibleCap = false; break; }
                    projectedCap.push(pt);
                    depthCap += pt.depth;
                }
                if(visibleCap){
                    drawItems.push({ depth: depthCap / projectedCap.length, points: projectedCap, fill: cap.fill, stroke: cap.stroke });
                }
            }

            let minV = Infinity, maxV = -Infinity, sum = 0;
            for(let i = 0; i < pressure.length; i++){
                const value = Number(pressure[i] || 0);
                if(value < minV) minV = value;
                if(value > maxV) maxV = value;
                sum += value;
            }
            const denom = Math.max(1e-6, CYLINDER_CONFIG.vmax - CYLINDER_CONFIG.vmin);
            for(let i = 0; i < cylinderMesh.faces.length; i++){
                const face = cylinderMesh.faces[i];
                if(!isFrontFacingCylinderFace(face.vertices)){
                    continue;
                }
                const projected = [];
                let depth = 0;
                let visible = true;
                for(let j = 0; j < face.vertices.length; j++){
                    const pt = projectCylinderPoint(face.vertices[j]);
                    if(!pt){ visible = false; break; }
                    projected.push(pt);
                    depth += pt.depth;
                }
                if(!visible){ continue; }
                let fill = CYLINDER_CONFIG.gapColor;
                let stroke = face.gap ? '#0b0b0b' : 'rgba(255,255,255,0.08)';
                if(!face.gap && face.colIndex >= 0){
                    const sampleRow = (cylinderMesh.rows - 1) - face.rowIndex;
                    const sampleCol = (cylinderMesh.cols - 1) - face.colIndex;
                    const value = Number(pressure[(sampleRow * cylinderMesh.cols) + sampleCol] || 0);
                    fill = pressureColorCss((value - CYLINDER_CONFIG.vmin) / denom);
                }
                drawItems.push({ depth: depth / projected.length, points: projected, fill: fill, stroke: stroke });
            }

            drawItems.sort(function(a, b){ return b.depth - a.depth; });
            for(let i = 0; i < drawItems.length; i++){
                drawCylinderPolygon(drawItems[i].points, drawItems[i].fill, drawItems[i].stroke);
            }

            cylinderCtx.strokeStyle = 'rgba(255,255,255,0.35)';
            cylinderCtx.lineWidth = 1;
            cylinderCtx.strokeRect(0.5, 0.5, width - 1, height - 1);

            cylinderStatsEl.textContent =
                'Drag to orbit, wheel to zoom | min ' + fmtNum(minV, 0) +
                ' | max ' + fmtNum(maxV, 0) +
                ' | mean ' + fmtNum(sum / Math.max(1, pressure.length), 1);
        }
        function setFrame(i){
            const count = frameCount();
            frame = clamp(i,0,Math.max(0,count-1));
            slider.value = String(frame);
            status.textContent = (frame+1) + ' / ' + count + '  (' + (frame/fps).toFixed(2) + 's)';
            updateOverlapPanel();
            updateSessionPanels();
        }
        function render(){
            resize();
            ctx.clearRect(0,0,canvas.width,canvas.height);
            ctx.fillStyle = '#ddd'; ctx.font = '14px Arial';
            ctx.fillText('Mouse drag: orbit | Zoom buttons/Wheel/PageUp/PageDown: zoom | Arrow keys: frame', 16, 22);
            const hw=Number(table.width||1)/2, hd=Number(table.depth||1)/2, h=Number(table.height||0.04);
            drawGrid(Math.max(hw, hd) * 1.25, Math.max(Math.max(hw, hd) / 8, 0.05));
            drawWorldAxes();
            const yTop=0, yBot=-h;
            const c=[[-hw,yTop,-hd],[hw,yTop,-hd],[hw,yTop,hd],[-hw,yTop,hd],[-hw,yBot,-hd],[hw,yBot,-hd],[hw,yBot,hd],[-hw,yBot,hd]];
            const edges=[[0,1],[1,2],[2,3],[3,0],[4,5],[5,6],[6,7],[7,4],[0,4],[1,5],[2,6],[3,7]];
            for(let i=0;i<edges.length;i++) line(c[edges[i][0]], c[edges[i][1]], '#cccccc', 1);
            for(let i=0;i<circles.length;i++){
                const p = circles[i];
                const center=[Number(p[0]||0),0,Number(p[1]||0)];
                if(outerRadius>0) circle3(center, outerRadius, '#00cfd1', 1);
                circle3(center, circleRadius, '#00ff66', 1.5);
                const pr=project(center);
                if(pr && circleLabels[i]){ ctx.fillStyle='#fff'; ctx.font='12px Arial'; ctx.fillText(String(circleLabels[i]), pr[0]+4, pr[1]-4); }
            }
            const pos = positions[frame] || (positions.length ? positions[positions.length-1] : null);
            const axis = axes[frame] || (axes.length ? axes[axes.length-1] : [0,1,0]);
            if(pos) drawCylinder([Number(pos[0]||0), Number(pos[1]||0), Number(pos[2]||0)], axis);
            renderPressureCylinder();
        }
        slider.addEventListener('input', function(){ setFrame(parseInt(slider.value||'0',10)||0); });
        playBtn.addEventListener('click', function(){ playing=!playing; playBtn.textContent=playing?'Pause':'Play'; });
        prevBtn.addEventListener('click', function(){ setFrame(frame-1); });
        nextBtn.addEventListener('click', function(){ setFrame(frame+1); });
        zoomOutBtn.addEventListener('click', function(){ applyZoomFactor(1 / 1.18); });
        zoomInBtn.addEventListener('click', function(){ applyZoomFactor(1.18); });
        resetViewBtn.addEventListener('click', function(){ resetView(); });
        canvas.addEventListener('mousedown', function(e){ dragging=true; lastX=e.clientX; lastY=e.clientY; });
        cylinderCanvas.addEventListener('mousedown', function(e){
            cylinderDragging = true;
            cylinderLastX = e.clientX;
            cylinderLastY = e.clientY;
            cylinderCanvas.classList.add('dragging');
            e.preventDefault();
        });
        window.addEventListener('mouseup', function(){ dragging=false; });
        window.addEventListener('mouseup', function(){ cylinderDragging=false; cylinderCanvas.classList.remove('dragging'); });
        window.addEventListener('mousemove', function(e){
            if(cylinderDragging){
                const dx = e.clientX - cylinderLastX;
                const dy = e.clientY - cylinderLastY;
                cylinderLastX = e.clientX;
                cylinderLastY = e.clientY;
                cylinderCam.yaw += dx * 0.01;
                cylinderCam.pitch = clamp(cylinderCam.pitch + dy * 0.01, -1.35, 1.35);
                return;
            }
            if(!dragging) return;
            const dx=e.clientX-lastX, dy=e.clientY-lastY;
            lastX=e.clientX; lastY=e.clientY;
            cam.yaw += dx*0.01;
            cam.pitch = clamp(cam.pitch + dy*0.01, -1.45, 1.45);
        });
        canvas.addEventListener('wheel', function(e){ e.preventDefault(); applyZoomFactor(Math.exp(-e.deltaY*0.0015)); }, {passive:false});
        cylinderCanvas.addEventListener('wheel', function(e){
            e.preventDefault();
            cylinderCam.zoom = clamp(cylinderCam.zoom * Math.exp(-e.deltaY * 0.0015), CYLINDER_MIN_ZOOM, CYLINDER_MAX_ZOOM);
        }, {passive:false});
        window.addEventListener('keydown', function(e){
            if(e.key==='ArrowRight') setFrame(frame+1);
            else if(e.key==='ArrowLeft') setFrame(frame-1);
            else if(e.key==='PageUp') applyZoomFactor(1.18);
            else if(e.key==='PageDown') applyZoomFactor(1/1.18);
            else if(e.key==='+' || e.key==='=') applyZoomFactor(1.18);
            else if(e.key==='-' || e.key==='_') applyZoomFactor(1/1.18);
            else if(e.key==='0') resetView();
            else if(e.key===' '){ playing=!playing; playBtn.textContent=playing?'Pause':'Play'; e.preventDefault(); }
        });
        loadSessionBtn.addEventListener('click', function(){
            sessionFileInput.click();
        });
        sessionFileInput.addEventListener('change', async function(){
            const f = sessionFileInput.files && sessionFileInput.files[0];
            if(!f){ return; }
            try{
                sessionLoadError = '';
                const text = await f.text();
                parseSessionText(text);
                sessionReady = true;
                refreshSliderMax();
                setFrame(frame);
            }catch(err){
                sessionLoadError = 'Failed to parse selected file (' + String(err && err.message || err) + ')';
                updateSessionPanels();
            }
        });
        function tick(ts){
            const dt = ts-lastTs; lastTs=ts;
            const count = frameCount();
            if(playing && count>1){
                accMs += dt;
                const step = 1000/fps;
                while(accMs>=step){
                    setFrame(frame+1);
                    accMs -= step;
                    if(frame>=count-1){ playing=false; playBtn.textContent='Play'; break; }
                }
            }
            render();
            requestAnimationFrame(tick);
        }
        refreshSliderMax();
        rebuildCylinderMesh();
        updateZoomStatus();
        loadSessionNdjson();
        setFrame(0);
        requestAnimationFrame(tick);
    </script>
</body>
